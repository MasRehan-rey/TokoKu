<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Keranjang Belanja — ShopLite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <nav class="navbar">
      <div class="navbar-inner">
        <a href="index.html" class="brand">
          <span class="brand-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </span>
          Shop<span>Lite</span>
        </a>

        <div class="nav-menu">
          <a href="index.html" class="nav-item">Home</a>
          <a href="index.html#products-section" class="nav-item">Shop</a>
          <a href="index.html#categories-section" class="nav-item">Collections</a>
          <a href="index.html#about-section" class="nav-item">About</a>
        </div>

        <div class="nav-actions">
          <div id="authArea" class="auth-area"></div>
          <a href="cart.html" class="nav-icon-btn cart-btn active" aria-label="Keranjang Belanja">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
            <span id="cartCount" class="cart-badge">0</span>
          </a>
        </div>
      </div>
    </nav>
  </header>

  <main class="container">
    <div class="page-header">
      <h1>Keranjang Belanja</h1>
      <a href="index.html" class="btn btn-secondary btn-sm">← Lanjut Belanja</a>
    </div>

    <div id="cartLayout" class="cart-layout">
      <div id="cartItemsList"></div>

      <div class="summary-card">
        <h3>Ringkasan Pesanan</h3>
        <div class="summary-row"><span>Subtotal</span><span id="sumSubtotal">$0.00</span></div>
        <div class="summary-row"><span>Pajak (8%)</span><span id="sumTax">$0.00</span></div>
        <div class="summary-row"><span>Ongkos Kirim</span><span id="sumShipping">$0.00</span></div>
        <div class="summary-row total"><span>Total</span><span id="sumTotal">$0.00</span></div>
        <button id="checkoutBtn" class="btn btn-primary btn-block" style="margin-top:16px;">
          Lanjut ke Pembayaran →
        </button>
      </div>
    </div>

    <div id="emptyCart" class="empty-state" style="display:none;">
      <div class="empty-state-icon">🛒</div>
      <h3>Keranjangmu masih kosong</h3>
      <p>Pilih produk yang kamu suka untuk mulai berbelanja.</p>
      <a href="index.html" class="btn btn-primary" style="margin-top:10px;">Mulai Belanja</a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container text-center">
      <p class="copyright">© 2026 ShopLite. Semua hak dilindungi.</p>
    </div>
  </footer>

  <script src="db.js"></script>
  <script src="auth.js"></script>
  <script src="cart.js"></script>
</body>
</html>
