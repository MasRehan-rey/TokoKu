<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Masuk — TokoKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <nav class="navbar">
      <div class="navbar-inner">
        <a href="index.html" class="brand">
          <span class="brand-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </span>
          Toko<span>Ku</span>
        </a>
        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm">← Kembali ke Toko</a>
        </div>
      </div>
    </nav>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Selamat Datang Kembali</h2>
      <p class="subtitle">Masuk untuk melanjutkan belanja di TokoKu.</p>

      <div id="formError" class="form-error"></div>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" required placeholder="nama@email.com">
        </div>
        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <div class="password-input-wrap" style="position: relative;">
            <input type="password" id="password" required placeholder="••••••••" style="padding-right: 40px; width: 100%; box-sizing: border-box;">
            <button type="button" id="togglePassword" aria-label="Tampilkan password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted);">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
        <div class="form-options" style="display: flex; justify-content: space-between; margin-bottom: 1rem; font-size: 0.9rem;">
          <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; color: var(--text-muted);">
            <input type="checkbox" id="rememberMe"> Ingat saya
          </label>
          <a href="#" id="forgotPasswordLink" style="color: var(--primary);">Lupa kata sandi?</a>
        </div>
        <button type="submit" id="loginBtn" class="btn btn-primary btn-block" style="margin-top:6px;">
          <span id="loginBtnText">Masuk ke Akun</span>
          <span id="loginSpinner" style="display: none;">⏳ Loading...</span>
        </button>
      </form>

      <p class="auth-switch">Belum punya akun? <a href="register.html">Daftar sekarang</a></p>

      <div class="demo-hint">
        <strong>Akun Demo:</strong><br>
        Admin: <code>admin@tokoku.demo</code> / <code>admin123</code><br>
        Pelanggan: <code>pelanggan@tokoku.demo</code> / <code>pelanggan123</code>
      </div>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container text-center">
      <p class="copyright">© 2026 TokoKu. Semua hak dilindungi.</p>
    </div>
  </footer>

  <script src="db.js"></script>
  <script src="auth.js"></script>
  <script>
    redirectIfLoggedIn(sessionStorage.getItem('checkoutProductId') ? 'checkout.html' : 'index.html');

    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');
    if (togglePassword && passwordInput) {
      togglePassword.addEventListener('click', () => {
        const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
        passwordInput.setAttribute('type', type);
      });
    }

    const forgotPasswordLink = document.getElementById('forgotPasswordLink');
    if (forgotPasswordLink) {
      forgotPasswordLink.addEventListener('click', (e) => {
        e.preventDefault();
        alert('Fitur lupa kata sandi adalah simulasi. Silakan hubungi administrator demo.');
      });
    }

    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const errorBox = document.getElementById('formError');
      const loginBtnText = document.getElementById('loginBtnText');
      const loginSpinner = document.getElementById('loginSpinner');
      const loginBtn = document.getElementById('loginBtn');
      const rememberMe = document.getElementById('rememberMe').checked;

      errorBox.classList.remove('show');
      loginBtn.disabled = true;
      loginBtnText.style.display = 'none';
      loginSpinner.style.display = 'inline-block';

      // Simulasi loading
      setTimeout(() => {
        const user = UserDB.verifyCredentials(email, password);
        if (!user) {
          errorBox.textContent = 'Email atau kata sandi salah.';
          errorBox.classList.add('show');
          loginBtn.disabled = false;
          loginBtnText.style.display = 'inline-block';
          loginSpinner.style.display = 'none';
          return;
        }

        SessionDB.login(user);
        if (rememberMe) {
          localStorage.setItem('tokoku_remember_me', email);
        } else {
          localStorage.removeItem('tokoku_remember_me');
        }

        window.location.href = sessionStorage.getItem('checkoutProductId')
          ? 'checkout.html'
          : user.role === 'admin' ? 'admin.html' : 'index.html';
      }, 800);
    });

    // Isi email jika "Ingat saya" pernah dicentang
    window.addEventListener('DOMContentLoaded', () => {
      const savedEmail = localStorage.getItem('tokoku_remember_me');
      if (savedEmail) {
        document.getElementById('email').value = savedEmail;
        document.getElementById('rememberMe').checked = true;
      }
    });
  </script>
</body>
</html>
