<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun — ShopLite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <nav class="navbar">
      <div class="navbar-inner">
        <a href="index.html" class="brand">
          <span class="brand-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </span>
          Shop<span>Lite</span>
        </a>
        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm">← Kembali ke Toko</a>
        </div>
      </div>
    </nav>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Buat Akun Baru</h2>
      <p class="subtitle">Daftar untuk menikmati belanja nyaman di ShopLite.</p>

      <div id="formError" class="form-error"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Nama Lengkap</label>
          <input type="text" id="name" required placeholder="Nama lengkapmu">
        </div>
        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" required placeholder="nama@email.com">
        </div>
        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <input type="password" id="password" required minlength="6" placeholder="Minimal 6 karakter">
        </div>
        <div class="form-group">
          <label for="confirmPassword">Konfirmasi Kata Sandi</label>
          <input type="password" id="confirmPassword" required placeholder="Ulangi kata sandi">
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top:6px;">Daftar Akun</button>
      </form>

      <p class="auth-switch">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container text-center">
      <p class="copyright">© 2026 ShopLite. Semua hak dilindungi.</p>
    </div>
  </footer>

  <script src="db.js"></script>
  <script src="auth.js"></script>
  <script>
    redirectIfLoggedIn('index.html');

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorBox = document.getElementById('formError');

      errorBox.classList.remove('show');

      if (password !== confirmPassword) {
        errorBox.textContent = 'Kata sandi tidak cocok.';
        errorBox.classList.add('show');
        return;
      }
      if (password.length < 6) {
        errorBox.textContent = 'Kata sandi minimal 6 karakter.';
        errorBox.classList.add('show');
        return;
      }

      try {
        const user = UserDB.create({ name, email, password, role: 'user' });
        SessionDB.login(user);
        window.location.href = sessionStorage.getItem('checkoutProductId')
          ? 'checkout.html'
          : 'index.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.add('show');
      }
    });
  </script>
</body>
</html>
