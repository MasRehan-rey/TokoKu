<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun — TokoKu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="site-header">
    <nav class="navbar">
      <div class="navbar-inner">
        <a href="index.html" class="brand">
          <span class="brand-icon">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <path d="M16 10a4 4 0 0 1-8 0"></path>
            </svg>
          </span>
          Toko<span>Ku</span>
        </a>
        <div class="nav-actions">
          <a href="index.html" class="btn btn-secondary btn-sm">← Kembali ke Toko</a>
        </div>
      </div>
    </nav>
  </header>

  <div class="auth-wrap">
    <div class="auth-card">
      <h2>Buat Akun Baru</h2>
      <p class="subtitle">Daftar untuk menikmati belanja nyaman di TokoKu.</p>

      <div id="formError" class="form-error"></div>

      <form id="registerForm">
        <div class="form-group">
          <label for="name">Nama Lengkap</label>
          <input type="text" id="name" required placeholder="Nama lengkapmu">
        </div>
        <div class="form-group">
          <label for="email">Alamat Email</label>
          <input type="email" id="email" required placeholder="nama@email.com">
        </div>
        <div class="form-group">
          <label for="password">Kata Sandi</label>
          <div class="password-input-wrap" style="position: relative;">
            <input type="password" id="password" required minlength="6" placeholder="Minimal 6 karakter" style="padding-right: 40px; width: 100%; box-sizing: border-box;">
            <button type="button" class="togglePasswordBtn" data-target="password" aria-label="Tampilkan password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted);">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
          <div id="passwordStrength" style="font-size: 0.8rem; margin-top: 4px; color: var(--text-muted);">Kekuatan kata sandi: <span id="strengthText">Belum cukup</span></div>
        </div>
        <div class="form-group">
          <label for="confirmPassword">Konfirmasi Kata Sandi</label>
          <div class="password-input-wrap" style="position: relative;">
            <input type="password" id="confirmPassword" required placeholder="Ulangi kata sandi" style="padding-right: 40px; width: 100%; box-sizing: border-box;">
            <button type="button" class="togglePasswordBtn" data-target="confirmPassword" aria-label="Tampilkan password" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: var(--text-muted);">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
          </div>
        </div>
        <div class="form-options" style="margin-bottom: 1rem; font-size: 0.9rem;">
          <label style="display: flex; align-items: flex-start; gap: 0.5rem; cursor: pointer; color: var(--text-muted);">
            <input type="checkbox" id="tosCheckbox" required style="margin-top: 3px;"> 
            <span>Saya setuju dengan <a href="#" style="color: var(--primary);">Syarat & Ketentuan</a> serta <a href="#" style="color: var(--primary);">Kebijakan Privasi</a> TokoKu.</span>
          </label>
        </div>
        <button type="submit" id="registerBtn" class="btn btn-primary btn-block" style="margin-top:6px;">
          <span id="registerBtnText">Daftar Akun</span>
          <span id="registerSpinner" style="display: none;">⏳ Loading...</span>
        </button>
      </form>

      <p class="auth-switch">Sudah punya akun? <a href="login.html">Masuk di sini</a></p>
    </div>
  </div>

  <footer class="site-footer">
    <div class="container text-center">
      <p class="copyright">© 2026 TokoKu. Semua hak dilindungi.</p>
    </div>
  </footer>

  <script src="db.js"></script>
  <script src="auth.js"></script>
  <script>
    redirectIfLoggedIn('index.html');

    const toggleBtns = document.querySelectorAll('.togglePasswordBtn');
    toggleBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.getAttribute('data-target');
        const input = document.getElementById(targetId);
        if (input) {
          const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
          input.setAttribute('type', type);
        }
      });
    });

    const passwordInput = document.getElementById('password');
    const strengthText = document.getElementById('strengthText');
    const strengthColors = ['var(--text-muted)', '#f44336', '#ff9800', '#4caf50'];
    const strengthLabels = ['Belum cukup', 'Lemah', 'Sedang', 'Kuat'];

    passwordInput.addEventListener('input', () => {
      const val = passwordInput.value;
      let score = 0;
      if (val.length >= 6) score++;
      if (val.match(/[A-Z]/) && val.match(/[0-9]/)) score++;
      if (val.length >= 10 && val.match(/[^A-Za-z0-9]/)) score++;
      
      if (val.length === 0) score = 0;
      
      strengthText.textContent = strengthLabels[score];
      strengthText.style.color = strengthColors[score];
    });

    document.getElementById('registerForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const errorBox = document.getElementById('formError');
      const registerBtn = document.getElementById('registerBtn');
      const registerBtnText = document.getElementById('registerBtnText');
      const registerSpinner = document.getElementById('registerSpinner');

      errorBox.classList.remove('show');

      if (password !== confirmPassword) {
        errorBox.textContent = 'Kata sandi tidak cocok.';
        errorBox.classList.add('show');
        return;
      }
      if (password.length < 6) {
        errorBox.textContent = 'Kata sandi minimal 6 karakter.';
        errorBox.classList.add('show');
        return;
      }

      registerBtn.disabled = true;
      registerBtnText.style.display = 'none';
      registerSpinner.style.display = 'inline-block';

      setTimeout(() => {
        try {
          const user = UserDB.create({ name, email, password, role: 'user' });
          SessionDB.login(user);
          alert('Registrasi berhasil! Mengarahkan ke halaman...');
          window.location.href = sessionStorage.getItem('checkoutProductId')
            ? 'checkout.html'
            : 'index.html';
        } catch (err) {
          errorBox.textContent = err.message;
          errorBox.classList.add('show');
          registerBtn.disabled = false;
          registerBtnText.style.display = 'inline-block';
          registerSpinner.style.display = 'none';
        }
      }, 800);
    });
  </script>
</body>
</html>
